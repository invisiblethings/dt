# Netlify configuration for pianoforall.com
# Full page-by-page reasoning: docs/05-migration-and-redirects.md

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Domain consolidation (attach these domains to this Netlify site as aliases)
# ---------------------------------------------------------------------------

# www -> apex
[[redirects]]
  from = "https://www.pianoforall.com/*"
  to = "https://pianoforall.com/:splat"
  status = 301
  force = true

# pianoforall.academy (old single-page React site) -> pianoforall.com
[[redirects]]
  from = "https://pianoforall.academy/terms.html"
  to = "https://pianoforall.com/terms-of-use"
  status = 301
  force = true
[[redirects]]
  from = "https://pianoforall.academy/privacy.html"
  to = "https://pianoforall.com/privacy-policy"
  status = 301
  force = true
[[redirects]]
  from = "https://pianoforall.academy/*"
  to = "https://pianoforall.com/"
  status = 301
  force = true
[[redirects]]
  from = "https://www.pianoforall.academy/*"
  to = "https://pianoforall.com/"
  status = 301
  force = true

