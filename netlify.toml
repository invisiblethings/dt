# Static site: no build step. Netlify serves the repository root.
[build]
  publish = "."

# Old Jekyll-era URLs
[[redirects]]
  from = "/feed.xml"
  to = "/"
  status = 301

[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

# Canonical host: apex domain without www
[[redirects]]
  from = "https://www.tom-brier.com/*"
  to = "https://tom-brier.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https://i.ytimg.com data:; frame-src https://www.youtube-nocookie.com; script-src 'self'; style-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
