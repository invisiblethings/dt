[build]
  command = "node build/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Legacy / common URLs → current pages
[[redirects]]
  from = "/free-inspection"
  to = "/free-estimate/"
  status = 301
[[redirects]]
  from = "/services"
  to = "/mold-removal/"
  status = 301
[[redirects]]
  from = "/services/*"
  to = "/mold-removal/"
  status = 301
[[redirects]]
  from = "/boroughs"
  to = "/service-areas/"
  status = 301
[[redirects]]
  from = "/locations/*"
  to = "/service-areas/"
  status = 301
[[redirects]]
  from = "/the-bronx"
  to = "/bronx/"
  status = 301
[[redirects]]
  from = "/black-mold-removal"
  to = "/mold-removal/black-mold/"
  status = 301
[[redirects]]
  from = "/mold-removal-cost"
  to = "/cost/"
  status = 301
[[redirects]]
  from = "/blog/*"
  to = "/guides/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
