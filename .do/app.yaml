# DigitalOcean App Platform spec for the live "axecontracting" app.
#
# App Platform does not read this file from the repo automatically. Apply it in
# the dashboard (app -> Settings -> App Spec -> Edit) or with
#   doctl apps update <app-id> --spec .do/app.yaml
#
# Note: this branch, not main, holds the AXE site (main currently holds a
# different project), so the app deploys from this branch.
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: axecontracting.org
  type: PRIMARY
  zone: axecontracting.org
- domain: www.axecontracting.org
  type: ALIAS
  zone: axecontracting.org
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  # Host-specific redirects go first; the catch-all below would otherwise match them.
  # www.axecontracting.org/<path> -> 301 https://axecontracting.org/<path>
  - match:
      authority:
        exact: www.axecontracting.org
      path:
        prefix: /
    redirect:
      authority: axecontracting.org
      redirect_code: 301
      scheme: https
  # The default *.ondigitalocean.app address -> the real domain, so it isn't indexed.
  - match:
      authority:
        exact: ${STARTER_DOMAIN}
      path:
        prefix: /
    redirect:
      authority: axecontracting.org
      redirect_code: 301
      scheme: https
  # Everything else (axecontracting.org) is served by the static site.
  - component:
      name: dt-public
    match:
      authority:
        exact: ""
      path:
        prefix: /
name: axecontracting
region: nyc
static_sites:
- environment_slug: html
  error_document: 404.html
  github:
    branch: claude/exciting-bardeen-x47had
    deploy_on_push: true
    repo: invisiblethings/dt
  name: dt-public
  source_dir: public
