# DigitalOcean App Platform spec: free static site served from /public.
# Create the app with: doctl apps create --spec .do/app.yaml
# (or in the DO dashboard: Create App -> GitHub -> invisiblethings/dt, then
#  set Source Directory to /public; no build command needed).
name: axe-contracting
static_sites:
  - name: web
    github:
      repo: invisiblethings/dt
      branch: main
      deploy_on_push: true
    source_dir: public
    error_document: 404.html
# After the app is live, add the domain under Settings -> Domains
# (axecontracting.org + www) and point DNS at DigitalOcean as instructed there.
# domains:
#   - domain: axecontracting.org
#     type: PRIMARY
#   - domain: www.axecontracting.org
#     type: ALIAS
