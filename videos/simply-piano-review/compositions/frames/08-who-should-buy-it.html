  <script>
    (function () {
      var FID = "08-who-should-buy-it";
      var P = "f" + FID + "-";
      var $ = function (s) { return document.getElementById(P + s); };
      var DUR = 12.075;

      // Build the typed lead line as per-character spans (deterministic, no runtime randomness).
      var typeHost = $("type");
      var segments = [
        { text: "a one-time course like ", hl: false },
        { text: "pianoforall", hl: true },
        { text: " goes further", hl: false }
      ];
      var chars = [];
      var hlWrap = null;
      segments.forEach(function (seg) {
        var parent = typeHost;
        if (seg.hl) {
          hlWrap = document.createElement("span");
          hlWrap.className = P + "hl";
          hlWrap.style.position = "relative";
          hlWrap.style.display = "inline-block";
          typeHost.appendChild(hlWrap);
          parent = hlWrap;
        }
        for (var i = 0; i < seg.text.length; i++) {
          var c = document.createElement("span");
          c.className = P + "ch";
          c.textContent = seg.text[i];
          parent.appendChild(c);
          chars.push(c);
        }
      });
      var underline = document.createElement("span");
      underline.id = P + "underline";
      underline.style.width = "100%";
      hlWrap.appendChild(underline);

      var TILT = 8;
      var OVER = 8;
      var tl = gsap.timeline({ paused: true });

      // Scene 0 — kicker slides down, hairline draws (sets the concept)
      tl.fromTo($("kicker"), { y: -24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.0);
      tl.fromTo($("topline"), { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.1);

      // Scene 1 (0.0–2.6) — left card from the left wing, book-open tilt facing right
      tl.fromTo($("card-left"),
        { x: -380, rotateY: TILT + OVER, scale: 0.88, opacity: 0 },
        { x: 0, rotateY: TILT, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, 0.12);
      tl.fromTo($("label-left"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.55);
      tl.fromTo($("h2-left"), { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.75);

      // Scene 2 (2.6–4.2) — cream verdict pill pops on the left card's inner edge
      tl.fromTo($("pill-left"), { scale: 0, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 2.6);

      // Divider draws in, anticipating the second side
      tl.fromTo($("divider"), { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power3.out" }, 3.7);

      // Scene 3 (4.2–6.6) — right card from the right wing, mirrored tilt facing left
      tl.fromTo($("card-right"),
        { x: 380, rotateY: -TILT - OVER, scale: 0.88, opacity: 0 },
        { x: 0, rotateY: -TILT, scale: 1, opacity: 1, duration: 1.0, ease: "power3.out" }, 4.2);
      tl.fromTo($("label-right"), { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 4.6);
      tl.fromTo($("h2-right"), { y: 28, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 4.8);
      tl.fromTo($("topborder"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 5.0);

      // Scene 4 (6.6–8.6) — orange verdict pill pops on the right card's inner edge
      tl.fromTo($("pill-right"), { scale: 0, opacity: 0, y: 16 }, { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 6.6);

      // Scene 5 (8.6–end) — lead line types under the right panel, then holds
      tl.fromTo($("arrow"), { x: -24, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, 8.6);
      var TYPE_AT = 8.8;
      var STEP = 0.03;
      chars.forEach(function (c, i) {
        tl.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, TYPE_AT + i * STEP);
      });
      var typedEnd = TYPE_AT + chars.length * STEP;
      tl.fromTo(underline, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, typedEnd + 0.15);

      // Counter-phase idle bob on the outer wraps (explicit finite tweens — left sin(t), right sin(t+π))
      function bob(el, start, amp, sign) {
        var half = 1.2;
        var t = start;
        var dir = sign;
        tl.fromTo(el, { y: 0 }, { y: -amp * dir, duration: half / 2, ease: "sine.out" }, t);
        t += half / 2;
        while (t + half <= DUR) {
          dir = -dir;
          tl.to(el, { y: -amp * dir, duration: half, ease: "sine.inOut" }, t);
          t += half;
        }
      }

      // Pad timeline to the fixed frame length
      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[FID] = tl;
    })();
