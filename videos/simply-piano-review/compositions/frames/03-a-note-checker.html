  <script>
    (function () {
      var ID = "03-a-note-checker";
      var root = document.querySelector('[data-composition-id="' + ID + '"]');
      var q = function (sel) { return root.querySelector(sel); };
      var qa = function (sel) { return Array.prototype.slice.call(root.querySelectorAll(sel)); };

      // svg-path-draw setup: measured lengths
      qa(".n03-draw").forEach(function (p) {
        var len = p.getTotalLength() * 1.02;
        p.style.strokeDasharray = len + "";
        p.style.strokeDashoffset = len + "";
      });

      var tl = gsap.timeline({ paused: true });

      // Macro camera: slow push toward the key row across the whole shot
      tl.fromTo(q("#n03-stage"), { scale: 1 }, { scale: 1.035, duration: 7.168, ease: "none" }, 0);

      // ---- Scene 1 (0.0-2.0): keys (focal) arrive fast, then the coined term ----
      tl.fromTo(q("#n03-strip"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(qa(".n03-wkey"), { y: 40, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.04 }, 0.05);
      tl.fromTo(qa(".n03-bkey"), { y: -30, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.45, ease: "power3.out", stagger: 0.04 }, 0.3);

      tl.fromTo(q("#n03-rail"), { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power2.out" }, 0.1);
      tl.fromTo(q("#n03-railnum"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.4);
      tl.fromTo(q("#n03-kicker"), { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power1.out" }, 0.45);
      // per-word reveal
      tl.fromTo(q("#n03-w1"), { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power3.out" }, 0.55);
      tl.fromTo(q("#n03-w2"), { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 0.72);

      // ---- Scene 2 (2.0-4.2): phone self-draws, mic wave draws, dashed hairline links keys ----
      tl.to(q("#n03-phone"), { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 2.05);
      tl.to(q("#n03-slot"), { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.65);
      tl.to(q("#n03-home"), { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 2.75);
      tl.to(q("#n03-wave"), { strokeDashoffset: 0, duration: 0.9, ease: "none" }, 2.85);
      tl.fromTo(q("#n03-dash"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 3.3);
      tl.fromTo(q("#n03-phonelbl"), { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 3.6);

      // sound travelling key-row -> phone along the hairline
      function pulse(sel, t) {
        tl.fromTo(q(sel), { x: 652, y: 533, opacity: 0 },
          { x: 392, opacity: 1, duration: 0.45, ease: "power1.in" }, t);
        tl.set(q(sel), { opacity: 0 }, t + 0.46);
        // mic "hears" it
        tl.fromTo(q("#n03-wave"), { scaleY: 1 }, { scaleY: 1.35, duration: 0.12, ease: "power1.out", svgOrigin: "270 540" }, t + 0.45);
        tl.to(q("#n03-wave"), { scaleY: 1, duration: 0.35, ease: "power2.out" }, t + 0.57);
      }
      pulse("#n03-pulse-a", 3.75);

      // ---- Scene 3 (4.2-6.2): "the right note" -> E presses, fills cream, check ----
      var P1 = 4.3, PD = 0.16, RD = 0.55;
      tl.to(q("#n03-k2"), { scale: 0.93, backgroundColor: "#2A2A26", duration: PD, ease: "power1.in" }, P1);
      tl.to(q("#n03-k2"), { scale: 1, backgroundColor: "#F0ECE5", borderColor: "#F0ECE5", duration: RD, ease: "power3.out" }, P1 + PD);
      tl.to(q("#n03-l2"), { color: "#111111", duration: 0.3, ease: "power1.out" }, P1 + PD);
      tl.fromTo(q("#n03-ring-ok"), { scale: 1, opacity: 0 }, { scale: 1.18, opacity: 0.8, duration: 0.45, ease: "power2.out" }, P1 + PD);
      tl.to(q("#n03-ring-ok"), { opacity: 0, duration: 0.5, ease: "power2.in" }, P1 + PD + 0.45);
      pulse("#n03-pulse-b", P1 + PD + 0.02);
      tl.to(q("#n03-check"), { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, P1 + PD + 0.3);

      // ---- Scene 4 (6.2-end): "at the right time" -> A presses, fills fire-orange, cross, verdict ----
      var P2 = 6.2;
      tl.to(q("#n03-k5"), { scale: 0.93, backgroundColor: "#2A2A26", duration: PD, ease: "power1.in" }, P2);
      tl.to(q("#n03-k5"), { scale: 1, backgroundColor: "#E85D26", borderColor: "#E85D26", duration: 0.5, ease: "power3.out" }, P2 + PD);
      tl.to(q("#n03-l5"), { color: "#111111", duration: 0.3, ease: "power1.out" }, P2 + PD);
      tl.fromTo(q("#n03-ring-bad"), { scale: 1, opacity: 0 }, { scale: 1.18, opacity: 0.9, duration: 0.4, ease: "power2.out" }, P2 + PD);
      tl.to(q("#n03-ring-bad"), { opacity: 0, duration: 0.4, ease: "power2.in" }, P2 + PD + 0.4);
      pulse("#n03-pulse-c", P2 + PD + 0.02);
      tl.to(q("#n03-x1"), { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, P2 + PD + 0.15);
      tl.to(q("#n03-x2"), { strokeDashoffset: 0, duration: 0.2, ease: "power2.out" }, P2 + PD + 0.3);
      tl.fromTo(q("#n03-stub"), { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, P2 + 0.35);
      tl.fromTo(q("#n03-verdict"), { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" }, P2 + 0.42);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
