        keys.appendChild(wk);
        if (blackAfter[i % 7] && i < WHITE - 1) {
          var bk = document.createElement("div");
          bk.className = "the-math-07-bkey";
          bk.style.left = ((i + 1) * w - w * 0.3).toFixed(4) + "%";
          bk.style.width = (w * 0.6).toFixed(4) + "%";
          keys.appendChild(bk);
        }

      var tl = gsap.timeline({ paused: true });

      // ---- camera: slow continuous push underneath the whole shot ----

      // ---- frame-row counter helper (deterministic, seek-safe) ----

        var ease = gsap.parseEase(easeName);
        var last = Math.max(1, Math.round(dur * FPS));
        for (var f = 0; f <= last; f++) {
          var v = from + (to - from) * ease(f / last);
          tl.set(el, { textContent: fmt(v) }, start + dur * (f / last));
        }
      }

      // ---- Scene 2 (1.4–3.6): $169.90 counts up with dynamic scale ----
      var rate = $("the-math-07-rate-fig");

      tl.fromTo(hero, { scale: 0.45 }, { scale: 1, duration: HERO_DUR, ease: "power3.out" }, HERO_AT);
      countRows(heroVal, 0, 340, HERO_AT, HERO_DUR, "power3.out", function (v) {
        return String(Math.round(v));
      });
      tl.fromTo($("the-math-07-lead"), { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.2);

      // ---- Scene 5 (7.6–end): coaching line + held beat, subtle jitter on $340 only ----
