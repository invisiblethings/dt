<!-- OPTIONAL. Ghost: Settings → Code injection → Site footer (site-wide).
     Use only until the theme edits in theme-edits.md are made; the theme fix is better.
     1. Gives the mobile menu button an accessible name.
     2. Fallback rel="sponsored" for any Amazon link still using a native Ghost button card. -->
<script>
(function () {
  var burger = document.querySelector('.gh-burger');
  if (burger && !burger.getAttribute('aria-label')) burger.setAttribute('aria-label', 'Open menu');
  document.querySelectorAll('.gh-content a[href*="amzn.to"], .gh-content a[href*="amazon."]').forEach(function (a) {
    a.rel = 'sponsored nofollow noopener';
    a.target = '_blank';
  });
})();
</script>
